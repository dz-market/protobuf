name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   uses: actions/setup-go@v7
                with:
                    go-version-file: go.mod

            -   uses: go-task/setup-task@v2
                with:
                    repo-token: '${{ secrets.GITHUB_TOKEN }}'

            -   uses: actions/cache@v6
                with:
                    path: bin
                    key: proto-tools-${{ hashFiles('Taskfile.yml') }}

            -   name: Verify contracts and generated code
                run: task verify

            -   name: Check breaking changes
                if: github.event_name == 'pull_request'
                run: task breaking BASELINE=${{ github.event.pull_request.base.sha }}