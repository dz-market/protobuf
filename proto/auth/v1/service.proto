edition = "2024";

package auth.v1;

import "auth/v1/messages.proto";
import option "google/api/annotations.proto";
import option "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Auth API"
    version: "1.0"
    description: "Authentication and session management."
    contact: {
      name: "dz-market"
      url: "https://github.com/dz-market/proto"
    }
    license: {
      name: "MIT"
      url: "https://github.com/dz-market/proto/blob/main/LICENSE"
    }
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Access token as \"Bearer {token}\"."
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Internal error."
      schema: {
        json_schema: {ref: ".google.rpc.Status"}
      }
    }
  }
  external_docs: {
    description: "Contracts and source"
    url: "https://github.com/dz-market/proto"
  }
};

// AuthService authenticates users and manages their tokens.
service AuthService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Credentials, tokens and sessions."};

  // Register creates an account and signs it in, returning a fresh token pair.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Register a new account"
      responses: {
        key: "201"
        value: {
          description: "Account created, token pair issued."
          schema: {
            json_schema: {ref: ".auth.v1.RegisterResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Email is already registered."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }

  // Login authenticates by email and password ans starts a new session.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Sign in"
      responses: {
        key: "200"
        value: {
          description: "Token pair issued, a new session started."
          schema: {
            json_schema: {ref: ".auth.v1.LoginResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Invalid email or password."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }

  // Refresh exchanges a refresh token for a new pair.
  // Both tokens are rotated, the old refresh token is spent.
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Exchange a refresh token for a new pair"
      responses: {
        key: "200"
        value: {
          description: "New token pair issued, the old one is spent."
          schema: {
            json_schema: {ref: ".auth.v1.RefreshResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Refresh token is unknown or expired."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }

  // Logout revokes the session the access token belongs to.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Revoke the current session"
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
      responses: {
        key: "200"
        value: {
          description: "Session revoked."
          schema: {
            json_schema: {ref: ".auth.v1.LogoutResponse"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Missing, expired or invalid access token."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }
}
