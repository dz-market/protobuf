edition = "2024";

package user.api.v1;

import "user/api/v1/messages.proto";
import option "google/api/annotations.proto";
import option "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "User API"
    version: "1.0"
    description: "API for managing and accessing user resources."
    contact: {
      name: "dz-market"
      url: "https://github.com/dz-market/protobuf"
    }
    license: {
      name: "MIT"
      url: "https://github.com/dz-market/protobuf/blob/main/LICENSE"
    }
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Access token as \"Bearer {token}\"."
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Internal error."
      schema: {
        json_schema: {ref: ".google.rpc.Status"}
      }
    }
  }
  external_docs: {
    description: "Contracts and source"
    url: "https://github.com/dz-market/protobuf"
  }
};

// UserService provides access to authenticated user resources.
service UserService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Authenticated user resources."};

  // GetMe returns the profile of the authenticated user.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {get: "/v1/users/me"};

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the authenticated user's profile"
      security: {
        security_requirement: {
          key: "bearer"
          value: {}
        }
      }
      responses: {
        key: "200"
        value: {
          description: "The authenticated user's profile."
          schema: {
            json_schema: {ref: ".user.api.v1.GetMeResponse"}
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Missing, expired or invalid access token."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "User profile is not created yet."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
        }
      }
    };
  }
}
