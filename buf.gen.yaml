version: v2

clean: true

managed:
    enabled: true
    disable:
        - path: third_party
    override:
        - file_option: go_package_prefix
          value: github.com/dz-market/proto/gen/go

plugins:
    - local: bin/protoc-gen-go
      out: gen/go
      opt:
          - paths=source_relative

    - local: bin/protoc-gen-go-grpc
      out: gen/go
      opt:
          - paths=source_relative

    - local: bin/protoc-gen-grpc-gateway
      out: gen/go
      opt:
          - paths=source_relative

    - local: bin/protoc-gen-openapiv2
      out: gen/openapiv2
      opt:
          - disable_default_responses=true
          - disable_default_errors=true